name: CI
 
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
 
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube needs full history for blame/SCM info
 
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
 
      - name: Backend - install deps
        working-directory: backend
        run: go mod download
 
      - name: Backend - run tests with coverage
        working-directory: backend
        run: go test ./... -coverprofile=coverage.out
 
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
 
      - name: Frontend - install deps
        working-directory: frontend
        run: npm ci
 
      - name: Frontend - run tests with coverage
        working-directory: frontend
        run: npm run test -- --coverage
        continue-on-error: true  # remove once frontend tests exist
 
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: build-and-check

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-artifact:
      runs-on: ubuntu-latest
      needs: build-and-check
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  
        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: "1.23"
  
        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: "20"
            cache: "npm"
            cache-dependency-path: frontend/package-lock.json
  
        - name: Build frontend
          working-directory: frontend
          run: |
            npm ci
            npm run build
  
        - name: Build backend
          working-directory: backend
          run: |
            go mod download
            go build -o server .
  
        - name: Assemble artifact
          run: |
            mkdir -p dist-package
            cp -r frontend/dist dist-package/frontend
            cp backend/server dist-package/server
            cp backend/.env.example dist-package/ 2>/dev/null || true
            cp README.md dist-package/README.md 2>/dev/null || true
  
        - name: Upload build artifact
          uses: actions/upload-artifact@v4
          with:
            name: geoemploi-build
            path: dist-package/
            retention-days: 7

  mirror-to-epitech:
    runs-on: ubuntu-latest
    needs: build-and-check
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.repository == 'RvbyY/Survivor-GeoEmploi'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EPITECH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push mirror to Epitech
        run: |
          git remote add epitech git@github.com:EpitechPGE3-2026/G-SVR-500-STG-5-1-survivor-8.git
          git push --mirror epitech